{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> 
        {% block title %} Page d'acceuil {% endblock %}
    </title>


    <link rel="stylesheet" href="{% static 'core/css/theme.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/header__footer.css' %}">
    <link rel="stylesheet" href="{% static 'core/css/easy/carrousel.css' %}">
    <link rel="shortcut icon" href="{% static 'core/images/logo.png' %}" type="image/x-icon">

    {% block css %}
        <style>
            main{
                min-height: 100vh;
            }
        </style>
    {% endblock %}
</head>
<body>
    {% include 'core/includes/notifications.html' %}


    <!-- Le header -->
    {% include "core/includes/header.html" %}
     


    {% block main %}

    {% endblock %}

    <!-- Le footer -->
    {% include "core/includes/footer.html" %}


    {% block js %}
    {% endblock %}

    <script src="{% static 'core/js/theme_mode.js' %}"></script>
    <script src="{% static 'core/js/easy/carrousel.js' %}"></script>


    <script>
        const menuHamburger = document.querySelector("#nav-toggle")
        const nav_menu = document.querySelector(".nav_menu")

        menuHamburger.addEventListener("click", ()=>{
            nav_menu.classList.toggle("show")
            menuHamburger.classList.toggle("active")
        })

    </script>
</body>
</html>
