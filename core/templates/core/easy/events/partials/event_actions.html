<button type="button" class="btn-favori {% if event.id in ids_favoris %}is-active{% endif %}" data-favori data-url="{% url 'core:toggle-favori' event.id %}" aria-label="Ajouter aux favoris" aria-pressed="{% if event.id in ids_favoris %}true{% else %}false{% endif %}"></button>

{% include 'core/easy/events/partials/gratuit_payant.html' %}

<div class="btn-row">
    <a href="{% url 'core:detail-event' event.id %}" class="btn-link primary">Voir les détails</a>
    {% if user.is_superuser or user.role == 'admin' or user.role == 'modérateur' or user == event.organisateur %}
        <a href="{% url 'core:edit-event' event.id %}" class="btn-link">Modifier</a>
        <button type="button" class="btn-link" data-supprimer data-action="{% url 'core:delete-event' event.id %}" data-titre="{{ event.titre }}">Supprimer</button>
    {% endif %}
</div>
