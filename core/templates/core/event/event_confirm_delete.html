{% extends 'core/base.html' %}

{% block title %}Supprimer l'événement{% endblock %}

{% block css %}
    {{ block.super }}
    <style>
        main { padding-top: 110px; min-height: 100vh; }
        .confirm-shell { max-width: 760px; margin: 0 auto; padding: 0 5% 60px; }
        .confirm-box {
            background: white; border: 1px solid #edf1f5; border-radius: 24px; padding: 30px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.06);
        }
        .confirm-box h1 { margin-top: 0; }
        .actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; padding: 12px 18px; border-radius: 12px;
            text-decoration: none; font-weight: 700; border: none; cursor: pointer;
        }
        .btn.danger { background: #e50914; color: white; }
        .btn.secondary { background: #f3f4f6; color: #111827; }
    </style>
{% endblock %}

{% block main %}
    <main>
        <div class="confirm-shell">
            <div class="confirm-box">
                <h1>Supprimer l'événement ?</h1>
                <p>Voulez-vous vraiment supprimer <strong>{{ event.title }}</strong> ? Cette action est irréversible.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="actions">
                        <button type="submit" class="btn danger">Oui, supprimer</button>
                        <a href="{% url 'core:event-detail' event.slug %}" class="btn secondary">Annuler</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
{% endblock %}
